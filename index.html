<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Работают ли сайт, вход, список серверов и документация NodeMP.">
  <title>Статус сервисов · NodeMP</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/web/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/web/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/web/fonts/unbounded-800-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/web/status.css">
  <script src="/web/status.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="https://nodemp.com" aria-label="nodemp.com">
        <img src="/web/mark.svg" width="28" height="28" alt="">
        <span>NodeMP</span>
      </a>
      <a class="to-site" href="https://nodemp.com">nodemp.com</a>
    </div>
  </header>

  <main class="wrap">
    <h1>Статус сервисов</h1>
    <p class="lede">Работают ли сайт, вход, список серверов и документация NodeMP.</p>

    <div class="summary" id="summary" aria-live="polite">
      <span class="dot"></span>
      <span id="summary-text">Загрузка…</span>
    </div>

    <section aria-label="Сервисы">
      <ul class="card services" id="services"></ul>
    </section>

    <section aria-labelledby="incidents-title">
      <h2 id="incidents-title">Сбои</h2>
      <div class="card incidents" id="incidents"><p class="muted">Загрузка…</p></div>
    </section>

    <noscript><p class="muted">Странице нужен JavaScript. Данные проверок лежат в репозитории <a href="https://github.com/NodeMP-BeamNG/status">NodeMP-BeamNG/status</a>.</p></noscript>
  </main>

  <footer class="wrap foot">
    <p>Проверка каждые 5 минут, из GitHub Actions и независимо от наших серверов. История проверок — в репозитории <a href="https://github.com/NodeMP-BeamNG/status">NodeMP-BeamNG/status</a>.</p>
  </footer>
</body>
</html>
