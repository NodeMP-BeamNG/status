name: Telegram test
on: workflow_dispatch
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send a sample message to every chat id
        env:
          KEY: ${{ secrets.NOTIFICATION_TELEGRAM_BOT_KEY }}
          CHATS: ${{ secrets.NOTIFICATION_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "NOTIFICATION_TELEGRAM_BOT_KEY is empty"; exit 1; }
          [ -n "$CHATS" ] || { echo "NOTIFICATION_TELEGRAM_CHAT_ID is empty"; exit 1; }
          text="Проверка. Так будут приходить сообщения о статусе NodeMP, например:

          Сбой: Сайт (код 503)
          Подробности: ссылка на сбой
          https://status.nodemp.com"
          text="$(printf '%s' "$text" | sed 's/^          //')"
          IFS=',' read -ra ids <<< "$CHATS"
          fail=0
          for id in "${ids[@]}"; do
            id="$(echo "$id" | xargs)"
            out="$(curl -sS -X POST "https://api.telegram.org/bot${KEY}/sendMessage" --data-urlencode "chat_id=${id}" --data-urlencode "text=${text}")"
            echo "$out" | jq -c '{ok, error_code, description, chat_type: .result.chat.type}'
            [ "$(echo "$out" | jq -r .ok)" = true ] || fail=1
          done
          exit $fail
