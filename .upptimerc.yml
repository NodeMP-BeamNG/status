owner: NodeMP-BeamNG
repo: status
user-agent: NodeMP-BeamNG
skipDescriptionUpdate: true
skipTopicsUpdate: true
secrets: []

# One line per service a player or a host uses, the way large status pages list their parts.
# Game servers are not a service of ours: none is listed.
sites:
  - name: Сайт
    slug: site
    url: https://nodemp.com/ru
    maxResponseTime: 3000
  - name: Вход и аккаунты
    slug: accounts
    url: https://api.nodemp.com/healthz
  - name: Список серверов
    slug: server-list
    url: https://api.nodemp.com/v1/browser/list
    maxResponseTime: 2000
  - name: Документация
    slug: docs
    url: https://docs.nodemp.com/ru/

# The page itself is ours (index.html, web/), served by GitHub Pages from master; Upptime's own
# site build (Static Site CI) is switched off. The README still links the address below.
status-website:
  cname: status.nodemp.com
  name: NodeMP

# Plain messages: no emoji, and no [skip ci], which would also skip the Pages build that
# publishes each status change. Upptime's push workflows only watch .upptimerc.yml and assets/.
commitMessages:
  readmeContent: "README: summary [upptime]"
  summaryJson: "Status summary [upptime]"
  statusChange: "$SITE_NAME: $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [upptime]"
  graphsUpdate: "Graphs [upptime]"

